name: Feature request
description: Suggest a new check, better fix guidance or another improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ideas and pull requests are welcome. The plugin is read-only by design, and a Recommendation must be doable in the Morpheus UI or inside the guest OS. If your idea runs something inside a VM or changes Morpheus, please describe how it should be protected.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: For a new check, what did a migration leave behind, and what does it cost if you leave it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Which Morpheus data (or which read-only in-guest command) would it use? How would someone fix it, and with what downtime and risk? Links to HPE documentation help.
  - type: dropdown
    id: pr
    attributes:
      label: Would you like to contribute a pull request?
      options:
        - "Yes"
        - "Maybe, with guidance"
        - "No"
